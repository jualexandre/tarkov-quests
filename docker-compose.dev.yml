services:
  backend:
    build:
      context: ./backend
      target: build
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - DATA_DIR=/app/data
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - tarkov_data_dev:/app/data

  frontend:
    build:
      context: ./frontend
      target: build
    command: npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "4200:4200"

volumes:
  backend_node_modules:
  frontend_node_modules:
  tarkov_data_dev:
