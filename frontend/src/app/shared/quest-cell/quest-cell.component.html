<div
  class="flex items-start gap-2 border-l-2 pl-2"
  [class.border-[var(--color-available)]]="!quest.completed && !showAsLocked"
  [class.border-[var(--color-locked)]]="showAsLocked"
  [class.border-transparent]="quest.completed"
>
  <input
    type="checkbox"
    class="mt-1 h-4 w-4 accent-[var(--color-accent)] disabled:cursor-not-allowed disabled:opacity-50"
    [checked]="quest.completed"
    [disabled]="showAsLocked"
    [title]="showAsLocked ? lockTooltip : ''"
    (change)="onToggleCompleted($event)"
  />
  <div>
    <p
      class="font-display text-[15px]"
      [class.line-through]="quest.completed"
      [class.text-[var(--color-text-muted)]]="quest.completed || isLocked"
      [class.text-[var(--color-accent)]]="!quest.completed && !isLocked"
    >
      {{ quest.name }}
      @if (showAsLocked) {
        <span [title]="lockTooltip" class="stamp stamp-locked">Locked</span>
      }
      @if (quest.completed) {
        <span class="stamp stamp-cleared">Cleared</span>
      }
    </p>
    <a
      [href]="wikiBaseUrl + quest.wikiUrl"
      target="_blank"
      rel="noopener"
      class="text-xs text-[var(--color-text-muted)] hover:text-[var(--color-accent)]"
    >
      Show on Wiki
    </a>
    <app-quest-requirements
      [minLevel]="quest.requirements.minLevel"
      [levelMet]="requirementsStatus.levelMet"
      [prerequisites]="requirementsStatus.prerequisites"
      [loyaltyNotes]="quest.requirements.loyaltyNotes"
      (prerequisiteSelected)="prerequisiteSelected.emit($event)"
    ></app-quest-requirements>
  </div>
</div>
