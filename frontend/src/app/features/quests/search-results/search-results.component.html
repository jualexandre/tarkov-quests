<div class="rounded-lg bg-[var(--color-bg)]">
  <table class="w-full table-fixed text-sm border-collapse">
    <thead>
      <tr
        class="font-display text-left text-[var(--color-text-muted)] border-b border-[var(--color-border)] sticky top-0 bg-[var(--color-bg)] z-10"
      >
        <th class="py-2 pr-2 w-[10%]">Trader</th>
        <th class="py-2 pr-2 w-[21%]">Quest</th>
        <th class="py-2 pr-4 w-[35%]">Objectives</th>
        <th class="py-2 pr-2 w-[17%]">Required items</th>
        <th class="py-2 w-[17%]">Rewards</th>
      </tr>
    </thead>
    <tbody>
      @for (quest of sortedResults(); track quest.id) {
        <tr class="border-b border-[var(--color-border)] align-top odd:bg-white/[0.02]">
          <td class="py-3 pr-2 break-words">
            <div class="flex items-center gap-2 text-[var(--color-accent)]">
              <app-trader-avatar [name]="quest.traderName" [imageUrl]="quest.traderImageUrl"></app-trader-avatar>
              <span class="truncate">{{ quest.traderName }}</span>
            </div>
          </td>
          <td class="py-3 pr-2 break-words">
            <app-quest-cell
              [quest]="quest"
              [playerLevel]="playerLevel"
              [completionBySlug]="completionBySlug"
              (toggled)="questToggled.emit($event)"
            ></app-quest-cell>
          </td>
          <td class="py-3 pr-4 text-[var(--color-text-muted)] break-words">
            <app-quest-list [items]="quest.objectives" [large]="true"></app-quest-list>
          </td>
          <td class="py-3 pr-2 text-[var(--color-text-muted)] break-words">
            <app-required-item-list [items]="quest.requiredItems"></app-required-item-list>
          </td>
          <td class="py-3 text-[var(--color-text-muted)] break-words">
            <app-quest-list [items]="quest.rewards"></app-quest-list>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="py-3 text-sm text-[var(--color-text-muted)]">No quests found matching your search.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
