<div class="rounded-lg bg-[var(--color-bg)]">
  <h2 class="text-lg font-semibold mb-3 text-[var(--color-accent)]">{{ trader.name }}</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="text-left text-[var(--color-text-muted)] border-b border-[var(--color-border)]">
        <th class="py-2 pr-2 w-1/6">Quest</th>
        <th class="py-2 pr-4 w-1/2">Objectives</th>
        <th class="py-2 w-1/3">Rewards</th>
      </tr>
    </thead>
    <tbody>
      @for (quest of sortedQuests(); track quest.id) {
        <tr class="border-b border-[var(--color-border)] align-top">
          <td class="py-2 pr-2">
            <div class="flex items-start gap-2">
              <input
                type="checkbox"
                class="mt-1 h-4 w-4 accent-[var(--color-accent)]"
                [checked]="quest.completed"
                (change)="onToggleCompleted(quest.id, $event)"
              />
              <div>
                <p
                  class="font-medium"
                  [class.line-through]="quest.completed"
                  [class.text-[var(--color-text-muted)]]="quest.completed"
                >
                  {{ quest.name }}
                </p>
                <a
                  [href]="wikiBaseUrl + quest.wikiUrl"
                  target="_blank"
                  rel="noopener"
                  class="text-xs text-[var(--color-text-muted)] hover:text-[var(--color-accent)]"
                >
                  Show on Wiki
                </a>
              </div>
            </div>
          </td>
          <td class="py-2 pr-4 text-[var(--color-text-muted)]">
            <ul class="list-disc list-inside space-y-0.5">
              @for (objective of quest.objectives; track $index) {
                <li [innerHTML]="objective"></li>
              }
            </ul>
          </td>
          <td class="py-2 text-[var(--color-text-muted)]">
            <ul class="list-disc list-inside space-y-0.5">
              @for (reward of quest.rewards; track $index) {
                <li [innerHTML]="reward"></li>
              }
            </ul>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="py-3 text-sm text-[var(--color-text-muted)]">No active quests.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
