<div class="flex flex-wrap gap-2 mb-4">
  @for (trader of traders; track trader.id) {
    <button
      type="button"
      class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full border border-[var(--color-border)] bg-[var(--color-surface)] hover:border-[var(--color-accent)] transition-colors"
      [class.border-[var(--color-accent)]]="trader.id === selectedTraderId"
      [class.text-[var(--color-accent)]]="trader.id === selectedTraderId"
      [attr.aria-pressed]="trader.id === selectedTraderId"
      (click)="onSelect(trader.id)"
    >
      @if (trader.imageUrl) {
        <img [src]="trader.imageUrl" [alt]="trader.name" class="h-8 w-8 rounded-full object-cover" />
      } @else {
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--color-border)] text-sm font-semibold">
          {{ trader.name.charAt(0) }}
        </span>
      }
      <span class="font-medium">{{ trader.name }}</span>
    </button>
  }
</div>
