<div class="flex flex-wrap gap-2 mb-4">
  @for (trader of traders; track trader.id) {
    <button
      type="button"
      class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full border bg-[var(--color-surface)] hover:border-[var(--color-accent)] transition-colors"
      [class.border-[var(--color-accent)]]="trader.id === selectedTraderId"
      [class.border-[var(--color-border)]]="trader.id !== selectedTraderId"
      [class.text-[var(--color-accent)]]="trader.id === selectedTraderId"
      [attr.aria-pressed]="trader.id === selectedTraderId"
      (click)="onSelect(trader.id)"
    >
      <app-trader-avatar [name]="trader.name" [imageUrl]="trader.imageUrl" size="md"></app-trader-avatar>
      <span class="font-medium">{{ trader.name }}</span>
    </button>
  }
</div>
