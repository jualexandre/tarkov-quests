<div class="flex flex-wrap gap-1.5 mb-4">
  @for (trader of traders; track trader.id) {
    <button
      type="button"
      class="flex items-center gap-1.5 pl-1 pr-2.5 py-1 rounded-full border bg-[var(--color-surface)] hover:border-[var(--color-accent)] transition-colors"
      [class.border-[var(--color-accent)]]="trader.id === selectedTraderId"
      [class.border-[var(--color-border)]]="trader.id !== selectedTraderId"
      [class.text-[var(--color-accent)]]="trader.id === selectedTraderId"
      [attr.aria-pressed]="trader.id === selectedTraderId"
      (click)="onSelect(trader.id)"
    >
      <app-trader-avatar [name]="trader.name" [imageUrl]="trader.imageUrl" size="sm"></app-trader-avatar>
      <span class="text-sm font-medium">{{ trader.name }}</span>
      <span class="text-xs text-[var(--color-text-muted)]">{{ completedCount(trader) }}/{{ trader.quests.length }}</span>
    </button>
  }
</div>
